
<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7931a" />
    <title>Oxana Bitcoin Wallet Pro</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 16px;
        background: #f5f7fa;
        color: #202124;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 600px;
        margin: 24px auto;
        padding: 24px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 20px #00000012;
      }
      h1 { font-size: 26px; }
      p { line-height: 1.8; }
      button, appkit-button {
        margin: 8px;
      }
      button {
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: #f7931a;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      code {
        display: block;
        overflow-wrap: anywhere;
        padding: 12px;
        background: #f1f3f4;
        border-radius: 8px;
        direction: ltr;
      }
      .note {
        color: #555;
        font-size: 14px;
      }
      .error { color: #b00020; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main2.jsx"></script>
  </body>
</html>
